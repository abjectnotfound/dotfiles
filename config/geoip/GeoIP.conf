# geoipupdate config (run via `make geoip`). AccountID and LicenseKey are not set here:
# they come from secrets/geoip.env (SOPS-encrypted) as GEOIPUPDATE_ACCOUNT_ID / GEOIPUPDATE_LICENSE_KEY.
EditionIDs GeoLite2-City
# Must match geoip-mmdb-file in config/trippy.toml
DatabaseDirectory /opt/homebrew/var/GeoIP
