# Help: `topgrade --config-reference` (displays https://github.com/topgrade-rs/topgrade/blob/main/config.example.toml)

[misc]
assume_yes = true
disable = ["node", "system", "pnpm", "yarn", "opencode", "gcloud"]
cleanup = true

[containers]
runtime = "podman"
system_prune = true

[git]
repos = ["~/src/*/"]
fallback_to_fetch_default = true

[firmware]
upgrade = true
