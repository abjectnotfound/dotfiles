# Help: `topgrade --config-reference` (displays https://github.com/topgrade-rs/topgrade/blob/main/config.example.toml)

[misc]
assume_yes = true
disable = ["system", "pnpm", "yarn", "node"]
cleanup = true

[commands]
"npm" = "npm update --location global --force"

[containers]
runtime = "podman"
system_prune = true

[git]
repos = ["~/src/*/"]
fallback_to_fetch_default = true
