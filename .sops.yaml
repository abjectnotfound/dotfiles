# SOPS encrypts secrets/*.env to each machine's age key, kept in that machine's login keychain.
# Add a machine: run `make sops-key` on it, add the printed key below, then run
# `sops updatekeys secrets/*.env` on a machine that can already decrypt.
creation_rules:
  - path_regex: secrets/.*\.env$
    key_groups:
      - age:
          - age1plt0kzsqvd8dp8hpd7055djyn0gtwz5edy8ca99tl8y4pdc0pqxs23h877  # M-D7R74D2VN4-US
