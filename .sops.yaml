# SOPS encrypts secrets/*.env to one shared age key. The private key lives in the password manager and,
# on each machine, in the login keychain (`make sops-key` imports it).
creation_rules:
  - path_regex: secrets/.*\.env$
    key_groups:
      - age:
          - age1plt0kzsqvd8dp8hpd7055djyn0gtwz5edy8ca99tl8y4pdc0pqxs23h877
